name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      # The server pins this key to rsync into the strapsheets public_html and nothing else
      # (authorized_keys: restrict,command="rrsync -wo <public_html>"). No shell, no other folder.
      DEPLOY_HOST: strapsheets.agent-swarm.net
      DEPLOY_USER: agent-swarm
      DEPLOY_HOST_KEY: "strapsheets.agent-swarm.net ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBtKX0bNlJLFmogS9PDS294meXOA94ywfJJrqtPTZ68t"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Upload to public_html
        env:
          DEPLOY_KEY: ${{ secrets.VIRTUALMIN_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          rsync -rltz --chmod=D755,F644 --itemize-changes \
            -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:./"
